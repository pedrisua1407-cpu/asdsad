<!DOCTYPE html>

<body>
    
<h1>Formulario de inscripción a una actividad escolar</h1>

<p>Complete los datos requeridos para inscribirse a una actividad escolar.</p>

<form>

<label>Nombre y apellido</label><br>

<input type="text"><br><br>

<label>DNI</label><br>

<input type="number"><br><br>

<label>Curso</label><br>

<input type="text"><br><br>

<label>Correo electronico</label><br>

<input type="email"><br><br>

<label>Edad</label><br>

<input type="number"><br><br>

<label>Turno de la escuela</label><br>

<input type="radio">Mañana <br>
<input type="radio">Tarde <br>
<input type="radio">Noche <br><br>

<label>¿Actividad mas te gusta?</label><br>

<select>

<option>Taller de informática</option><br>
<option>Deportes</option><br>
<option>Arte</option><br>
<option>Música</option><br><br>

</select><br><br>

<label>Intereses</label><br>

<input type="checkbox">Programación <br>
<input type="checkbox">Diseño <br>
<input type="checkbox">Robotica <br>
<input type="checkbox">Edicion de video <br><br>

<label>Observaciones</label><br>

<textarea rows="5"></textarea><br>

</form>

<button>enviar formulario</button>

</body>
</html>
